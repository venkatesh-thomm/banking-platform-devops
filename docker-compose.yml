services:

  postgres:
    image: postgres:16
    container_name: banking-postgres

    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./app/backend

    container_name: banking-backend

    environment:
      DATABASE_URL: postgresql://banking_user:banking_password@postgres:5432/banking

    ports:
      - "8000:8000"

    depends_on:
      - postgres

volumes:
  postgres_data: