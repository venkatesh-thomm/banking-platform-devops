apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: banking-db-secret
  namespace: {{ .Release.Namespace }}

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: banking-db-secret
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.database.secretKey | quote }}
        property: username

    - secretKey: password
      remoteRef:
        key: {{ .Values.database.secretKey | quote }}
        property: password

    - secretKey: database
      remoteRef:
        key: {{ .Values.database.secretKey | quote }}
        property: database